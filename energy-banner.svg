<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="visorGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150f2e"/>
      <stop offset="100%" stop-color="#1b1440"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="260" rx="14" fill="url(#bgGrad)"/>

  <!-- particulas de fondo -->
  <circle cx="120" cy="35"  r="2"   fill="#e9d5ff"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="60"  cy="220" r="1.6" fill="#c084fc"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.2s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="870" cy="60"  r="2"   fill="#e9d5ff"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" begin="0.8s" repeatCount="indefinite"/></circle>
  <circle cx="840" cy="220" r="1.6" fill="#a855f7"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s"  begin="1.1s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="230" r="1.8" fill="#c084fc"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.4s" begin="0.5s" repeatCount="indefinite"/></circle>

  <!-- ===================== ASTRONAUTA PROGRAMADOR (izquierda) ===================== -->
  <g transform="translate(150,145)">
    <animateTransform attributeName="transform" type="translate"
      values="150,145; 154,138; 150,145; 146,152; 150,145" dur="7s" repeatCount="indefinite" additive="sum" calcMode="linear"/>

    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3;3;-3" dur="5s" repeatCount="indefinite"/>

      <!-- mochila -->
      <rect x="-30" y="-10" width="22" height="56" rx="8" fill="#312e81" opacity="0.9"/>
      <path d="M -20,-8 C -34,-18 -34,-36 -16,-42" stroke="#a855f7" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>

      <!-- cuerpo -->
      <rect x="-26" y="-2" width="52" height="64" rx="22" fill="#f5f3ff" filter="url(#soft)"/>
      <rect x="-26" y="-2" width="52" height="64" rx="22" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.6"/>

      <!-- panel de pecho -->
      <rect x="-11" y="18" width="22" height="14" rx="4" fill="#7e22ce" opacity="0.8"/>
      <circle cx="-4" cy="25" r="1.8" fill="#e9d5ff"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="4"  cy="25" r="1.8" fill="#e9d5ff"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>

      <!-- piernas -->
      <rect x="-20" y="46" width="15" height="28" rx="7" fill="#f5f3ff" transform="rotate(-6)"/>
      <rect x="6"   y="46" width="15" height="28" rx="7" fill="#f5f3ff" transform="rotate(8)"/>

      <!-- casco -->
      <circle cx="0" cy="-28" r="24" fill="#f5f3ff" filter="url(#soft)"/>
      <circle cx="0" cy="-28" r="24" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.6"/>
      <ellipse cx="-2" cy="-28" rx="15.5" ry="16.5" fill="url(#visorGrad)"/>
      <text x="-2" y="-24" font-family="JetBrains Mono, monospace" font-size="11" fill="#f5f3ff" text-anchor="middle" opacity="0.85">&lt;/&gt;</text>
      <ellipse cx="-8" cy="-35" rx="4.5" ry="2.6" fill="#ffffff" opacity="0.5"/>

      <!-- antena -->
      <line x1="14" y1="-46" x2="18" y2="-57" stroke="#c084fc" stroke-width="2"/>
      <circle cx="18" cy="-57" r="2.6" fill="#e9d5ff">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.3s" repeatCount="indefinite"/>
      </circle>

      <!-- laptop en las piernas, tecleando hacia la terminal -->
      <g transform="translate(20,34)">
        <rect x="0" y="0" width="34" height="22" rx="3" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
        <rect x="3" y="4"  width="12" height="2.5" rx="1" fill="#c084fc"><animate attributeName="width" values="0;12;12;0" dur="1.6s" repeatCount="indefinite"/></rect>
        <rect x="3" y="9"  width="18" height="2.5" rx="1" fill="#a855f7"><animate attributeName="width" values="0;0;18;0" dur="1.6s" repeatCount="indefinite"/></rect>
        <rect x="3" y="14" width="9"  height="2.5" rx="1" fill="#e9d5ff"><animate attributeName="width" values="0;0;0;9" dur="1.6s" repeatCount="indefinite"/></rect>
      </g>

      <!-- brazo tecleando (rebote) -->
      <rect x="24" y="24" width="16" height="16" rx="7" fill="#f5f3ff">
        <animateTransform attributeName="transform" type="rotate" values="-6 24 24;10 24 24;-6 24 24" dur="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="-44" y="6" width="16" height="30" rx="8" fill="#f5f3ff" transform="rotate(15)"/>
    </g>
  </g>

  <!-- flechita / rayo conectando astronauta -> terminal -->
  <g stroke="#c084fc" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M 235,175 C 255,175 265,175 280,175">
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ===================== TERMINAL (derecha, aqui se "construye" el texto) ===================== -->
  <g filter="url(#glow)">
    <rect x="290" y="34" width="560" height="192" rx="14" fill="url(#termGrad)" stroke="#a855f7" stroke-width="1.5" opacity="0.95"/>
  </g>

  <!-- barra superior estilo mac -->
  <rect x="290" y="34" width="560" height="26" rx="14" fill="#241a4a"/>
  <rect x="290" y="46" width="560" height="14" fill="#241a4a"/>
  <circle cx="310" cy="47" r="5" fill="#ff5f56"/>
  <circle cx="328" cy="47" r="5" fill="#ffbd2e"/>
  <circle cx="346" cy="47" r="5" fill="#27c93f"/>
  <text x="570" y="51" font-family="JetBrains Mono, monospace" font-size="12" fill="#8b7cc7" text-anchor="middle">bash — marvin@devbox</text>

  <!-- lineas de la terminal, reveladas con clip-path (efecto de tecleo) -->
  <g font-family="JetBrains Mono, monospace" font-size="18">
    <g clip-path="url(#clip1)">
      <text x="312" y="98"><tspan fill="#c084fc">$ </tspan><tspan fill="#f5f3ff">whoami</tspan></text>
    </g>
    <clipPath id="clip1"><rect x="300" y="80" width="0" height="26"><animate attributeName="width" values="0;530" dur="0.6s" begin="0.4s" fill="freeze"/></rect></clipPath>

    <g clip-path="url(#clip2)">
      <text x="312" y="128" fill="#e9d5ff">marvin-carbajal</text>
    </g>
    <clipPath id="clip2"><rect x="300" y="110" width="0" height="26"><animate attributeName="width" values="0;530" dur="0.8s" begin="1.3s" fill="freeze"/></rect></clipPath>

    <g clip-path="url(#clip3)">
      <text x="312" y="158"><tspan fill="#c084fc">$ </tspan><tspan fill="#f5f3ff">cat stack.info</tspan></text>
    </g>
    <clipPath id="clip3"><rect x="300" y="140" width="0" height="26"><animate attributeName="width" values="0;530" dur="0.7s" begin="2.4s" fill="freeze"/></rect></clipPath>

    <g clip-path="url(#clip4)">
      <text x="312" y="192" font-size="15" fill="#e9d5ff">Full Stack Developer · Ingeniero en Sistemas</text>
    </g>
    <clipPath id="clip4"><rect x="300" y="175" width="0" height="26"><animate attributeName="width" values="0;530" dur="1.2s" begin="3.4s" fill="freeze"/></rect></clipPath>
  </g>

  <!-- cursor parpadeante al final del texto -->
  <rect x="718" y="180" width="9" height="18" fill="#e9d5ff" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.9s" begin="4.6s" repeatCount="indefinite"/>
  </rect>
</svg>
